name: 🔎 Production Audit (read-only)

# Read-only snapshot of the live site, Search Console and Cloudflare config.
# Nothing is committed or deployed.
on:
  workflow_dispatch: {}
  push:
    branches: ['claude/**']
    paths:
      - 'scripts/diagnostics/**'
      - '.github/workflows/site-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run audit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/diagnostics/site-audit.js
