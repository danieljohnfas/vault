name: Test D1

on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/test-d1.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: npm install -g wrangler
      - name: Run Test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute hv-directory --remote --command="SELECT sql FROM sqlite_master WHERE name LIKE '%fts%'"
          npx wrangler d1 execute hv-directory --remote --command="SELECT sql FROM sqlite_master WHERE name = 'sites_fts'"
