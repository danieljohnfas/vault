name: 🗓️ Daily Site Addition

on:
  schedule:
    # Runs every day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of sites to claim from queue per shard'
        required: false
        default: '400'
      dry_run:
        description: 'Dry run (no commits)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  daily-add:
    name: Add Sites to Directory
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3, 4, 5]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Fetch existing site URLs from D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "==== Fetching existing URLs from D1 ===="
          npx wrangler d1 execute hv-directory --remote \
            --command="SELECT url FROM sites;" \
            --json > /tmp/d1_urls_raw.json 2>/dev/null || echo '[]' > /tmp/d1_urls_raw.json

          node -e "
            const raw = require('/tmp/d1_urls_raw.json');
            const rows = Array.isArray(raw) && raw[0] && raw[0].results ? raw[0].results : [];
            const urls = rows.map(r => r.url);
            require('fs').writeFileSync('/tmp/existing_urls.json', JSON.stringify(urls));
            console.log('Existing sites in D1: ' + urls.length);
          "

      - name: Claim batch from D1 Queue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          COUNT="${{ github.event.inputs.count || '400' }}"
          echo "==== Claiming $COUNT sites from D1 Queue (Shard ${{ matrix.shard }}) ===="
          # Use an UPDATE ... RETURNING to safely claim a batch for this runner
          npx wrangler d1 execute hv-directory --remote \
            --command="UPDATE queue SET status = 'processing', claimed_at = datetime('now') WHERE id IN (SELECT id FROM queue WHERE status = 'pending' LIMIT $COUNT) RETURNING *;" \
            --json > /tmp/claimed_queue_raw.json 2>/dev/null || echo '[]' > /tmp/claimed_queue_raw.json
          
          # Write claimed rows into a flat JSON format expected by the script
          node -e "
            const raw = require('/tmp/claimed_queue_raw.json');
            const rows = Array.isArray(raw) && raw[0] && raw[0].results ? raw[0].results : [];
            require('fs').writeFileSync('/tmp/claimed_queue.json', JSON.stringify(rows));
            console.log('Claimed ' + rows.length + ' sites for processing.');
          "

      - name: Run daily site addition pipeline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"

          echo "==== EVALUATING CLAIMED SITES ===="
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/daily-add.js --dry-run \
              --existing-urls /tmp/existing_urls.json \
              --queue-file /tmp/claimed_queue.json \
              --output-sql /tmp/new_sites.sql \
              --output-queue-sql /tmp/queue_updates.sql
          else
            node scripts/daily-add.js \
              --existing-urls /tmp/existing_urls.json \
              --queue-file /tmp/claimed_queue.json \
              --output-sql /tmp/new_sites.sql \
              --output-queue-sql /tmp/queue_updates.sql
          fi

      - name: Insert new sites into D1
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -f /tmp/new_sites.sql ] && [ -s /tmp/new_sites.sql ]; then
            echo "==== Inserting new sites into D1 ===="
            node scripts/split-sql.js /tmp/new_sites.sql /tmp/sql_batches
            for f in /tmp/sql_batches/batch_*.sql; do
              echo "  Executing $f..."
              npx wrangler d1 execute hv-directory --remote --file="$f"
            done
            echo "==== D1 insert complete ===="
          else
            echo "No new SQL to insert."
          fi

      - name: Update Queue Status
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -f /tmp/queue_updates.sql ] && [ -s /tmp/queue_updates.sql ]; then
            echo "==== Marking processed sites in D1 ===="
            npx wrangler d1 execute hv-directory --remote --file="/tmp/queue_updates.sql"
            echo "==== Queue update complete ===="
          fi
