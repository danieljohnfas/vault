name: 📣 Release listings & IndexNow

# Daily drip-feed: releases up to 100 new listings to search engines (best-rated
# first) and sends every sitemap change to IndexNow (scripts/indexnow.mjs). Runs
# after the daily add (06:00) and the link checker (08:00).
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test the rules
        run: node --test 'scripts/test/*.test.mjs'
      - name: Release and notify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/indexnow.mjs
