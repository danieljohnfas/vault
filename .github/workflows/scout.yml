name: 🕵️ Scout V3

on:
  schedule:
    # Four times a day; each run validates up to 3,000 new candidate sites.
    - cron: '7 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scout:
    name: Advanced Spider, Social & AI Scout
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Configure Git
        run: |
          git config user.name "HentaiVault Scout Bot"
          git config user.email "bot@hentaivault.me"

      - name: Fetch existing site URLs from D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/export-existing-urls.mjs /tmp/existing_urls_scout.json

      - name: Run Scout V3
        run: |
          node scripts/scout-v3.js --existing-urls /tmp/existing_urls_scout.json

      - name: Insert Discoveries into D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -f scripts/scout-inserts.sql ]; then
            echo "==== Inserting into Queue ===="
            node scripts/d1-exec-file.mjs scripts/scout-inserts.sql
          fi
